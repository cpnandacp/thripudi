<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <!-- Keyboarding ചെയ്യുമ്പോൾ Zoom തടയാനുള്ള Viewport സജ്ജീകരണം -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Student Portal</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. SPLASH SCREEN -->
  <div id="splashScreen">
    <div class="splash-content text-center">
      <!-- ലോഗോ ഇമേജ്: നിങ്ങളുടെ assets/logo.png ഇമേജ് ഫയൽ path കൊടുക്കാം -->
      <img src="assets/logo.png" alt="Logo" class="splash-logo mb-3" onerror="this.style.display='none'">
      <h2 class="fw-bold text-white mb-2">Student Portal</h2>
      <p class="text-white-50 small mb-3">Loading application...</p>
      <div class="spinner-border text-light" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div class="container main-container">
    
    <!-- Header with Logo -->
    <div class="app-header d-flex align-items-center justify-content-between card p-2 mb-2">
      <div class="d-flex align-items-center gap-2">
        <img src="assets/logo.png" alt="Logo" class="header-logo" onerror="this.src='https://via.placeholder.com/40'">
        <h6 class="fw-bold text-primary m-0">Student Portal</h6>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <ul class="nav nav-pills nav-justified mb-2 card p-1 flex-row" id="pills-tab">
      <li class="nav-item">
        <button class="nav-link active py-1 px-2 small" id="tab-mark-btn" onclick="switchTab('mark')">Enter Marks</button>
      </li>
      <li class="nav-item">
        <button class="nav-link py-1 px-2 small" id="tab-student-btn" onclick="switchTab('student')">Add Student</button>
      </li>
      <li class="nav-item">
        <button class="nav-link btn-success text-white fw-bold py-1 px-2 small" id="tab-report-btn" onclick="openReportModal()">Report 📊</button>
      </li>
    </ul>

    <!-- Mark Entry Section -->
    <div id="markSec" class="card p-3">
      <h6 class="fw-bold mb-2 text-primary text-center">Student Data Entry</h6>
      <form id="markForm">
        <div class="row g-2">
          <div class="col-6 mb-2">
            <label class="form-label">Course</label>
            <select id="mkCourse" class="form-select" onchange="fetchDetails()">
              <option value="BA English">BA English</option>
              <option value="BA Sociology">BA Sociology</option>
              <option value="BCom A">BCom A</option>
              <option value="BCom B">BCom B</option>
              <option value="BBA">BBA</option>
              <option value="BSc">BSc</option>
            </select>
          </div>
          <div class="col-6 mb-2">
            <label class="form-label">Semester</label>
            <select id="mkSem" class="form-select" onchange="fetchDetails()">
              <option value="Semester 1">Semester 1</option>
              <option value="Semester 2">Semester 2</option>
              <option value="Semester 3">Semester 3</option>
              <option value="Semester 4">Semester 4</option>
            </select>
          </div>
        </div>

        <div class="mb-2">
          <label class="form-label">Roll Number</label>
          <input type="number" id="roll" class="form-control" oninput="fetchDetails()" required placeholder="Enter Roll No">
        </div>

        <div class="mb-2">
          <label class="form-label">Student Name</label>
          <input type="text" id="name" class="form-control" readonly placeholder="Name will appear automatically" style="background-color: #eef2ff;">
        </div>

        <div class="row g-1 mb-2">
          <div class="col-3">
            <label class="form-label">Assign.</label>
            <input type="number" id="assignment" class="form-control" placeholder="Score">
            <div id="stAssignment" class="mt-1"></div>
          </div>
          <div class="col-3">
            <label class="form-label">Seminar</label>
            <input type="number" id="seminar" class="form-control" placeholder="Score">
            <div id="stSeminar" class="mt-1"></div>
          </div>
          <div class="col-3">
            <label class="form-label">Exam</label>
            <input type="number" id="exam" class="form-control" placeholder="Score">
            <div id="stExam" class="mt-1"></div>
          </div>
          <div class="col-3">
            <label class="form-label">Notes</label>
            <input type="number" id="notesVal" class="form-control" placeholder="Count">
            <div id="stNotes" class="mt-1"></div>
          </div>
        </div>

        <button type="button" class="btn btn-primary w-100 py-2 mt-2" onclick="submitMark()">Save Data</button>
      </form>
    </div>

    <!-- Add Student Section -->
    <div id="studentSec" class="card p-3 d-none">
      <h6 class="fw-bold mb-2 text-primary text-center">Add New Student</h6>
      <form id="studentForm">
        <div class="mb-2">
          <label class="form-label">Roll Number</label>
          <input type="number" id="stRoll" class="form-control" required placeholder="Roll Number">
        </div>
        <div class="mb-2">
          <label class="form-label">Full Name</label>
          <input type="text" id="stName" class="form-control" required placeholder="Student Name">
        </div>
        <div class="row g-2">
          <div class="col-6 mb-2">
            <label class="form-label">Semester</label>
            <select id="stSem" class="form-select">
              <option value="Semester 1">Semester 1</option>
              <option value="Semester 2">Semester 2</option>
              <option value="Semester 3">Semester 3</option>
              <option value="Semester 4">Semester 4</option>
            </select>
          </div>
          <div class="col-6 mb-2">
            <label class="form-label">Course</label>
            <select id="stCourse" class="form-select">
              <option value="BA English">BA English</option>
              <option value="BA Sociology">BA Sociology</option>
              <option value="BCom A">BCom A</option>
              <option value="BCom B">BCom B</option>
              <option value="BBA">BBA</option>
              <option value="BSc">BSc</option>
            </select>
          </div>
        </div>
        <button type="button" class="btn btn-primary w-100 py-2 mt-2" onclick="submitStudent()">Add Student</button>
      </form>
    </div>

  </div>

  <!-- FULL PAGE REPORT SECTION -->
  <div id="reportPage">
    <div class="container-fluid p-0">
      <div class="card p-2 mb-3 no-print bg-light border">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="fw-bold text-primary m-0">📊 Report</h6>
          <div>
            <button class="btn btn-sm btn-success me-1" onclick="window.print()">🖨️ Print</button>
            <button class="btn btn-sm btn-secondary" onclick="closeReportModal()">❌ Close</button>
          </div>
        </div>
        
        <div class="row g-2">
          <div class="col-4">
            <label class="form-label small">Course</label>
            <select id="rptCourse" class="form-select">
              <option value="BA English">BA English</option>
              <option value="BA Sociology">BA Sociology</option>
              <option value="BCom A">BCom A</option>
              <option value="BCom B">BCom B</option>
              <option value="BBA">BBA</option>
              <option value="BSc">BSc</option>
            </select>
          </div>
          <div class="col-4">
            <label class="form-label small">Semester</label>
            <select id="rptSem" class="form-select">
              <option value="Semester 1">Semester 1</option>
              <option value="Semester 2">Semester 2</option>
              <option value="Semester 3">Semester 3</option>
              <option value="Semester 4">Semester 4</option>
            </select>
          </div>
          <div class="col-4">
            <label class="form-label small">Roll No</label>
            <input type="number" id="rptRoll" class="form-control" placeholder="All">
          </div>
          <div class="col-12 mt-2">
            <button class="btn btn-sm btn-primary w-100" onclick="loadReport()">Generate Report</button>
          </div>
        </div>
      </div>

      <div id="printableArea">
        <div class="text-center mb-3">
          <h5 class="fw-bold text-uppercase m-0" id="rptHeading">CLASS REPORT</h5>
          <p class="text-muted small m-0" id="rptSubHeading"></p>
        </div>

        <div class="table-responsive">
          <table class="table table-bordered align-middle small mb-0">
            <thead class="table-dark text-center">
              <tr>
                <th style="width: 40px;">Roll</th>
                <th>Name</th>
                <th>Assign</th>
                <th>Sem.</th>
                <th>Exam</th>
                <th>Notes</th>
                <th style="width: 80px;">Signature</th>
              </tr>
            </thead>
            <tbody id="reportTableBody">
            </tbody>
          </table>
        </div>

        <div class="row mt-4 pt-2 text-center small">
          <div class="col-4">
            <p class="fw-bold mb-3">Prepared By</p>
            <p>___________</p>
          </div>
          <div class="col-4">
            <p class="fw-bold mb-3">In-charge</p>
            <p>___________</p>
          </div>
          <div class="col-4">
            <p class="fw-bold mb-3">HOD</p>
            <p>___________</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Custom JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
